<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Youmi Cake Manager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{color-scheme:light dark;--bg:#f8fafc;--card:#fff;--tx:#1e293b;--mut:#64748b;--bd:#e2e8f0;--br:#e11d48;--soft:#fff1f2;--inp:#f1f5f9;--head:#db2777;--tot:#0f172a;--gold:#facc15;--ok:#34d399;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151b2e;--tx:#e5e7eb;--mut:#94a3b8;--bd:#27304a;--br:#fb7185;--soft:#3b1d2a;--inp:#1e2640;--head:#9d174d;--tot:#050814}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#151b2e;--tx:#e5e7eb;--mut:#94a3b8;--bd:#27304a;--br:#fb7185;--soft:#3b1d2a;--inp:#1e2640;--head:#9d174d;--tot:#050814}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head);z-index:10}
header{background:var(--head);color:#fff;padding:14px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:9;box-shadow:0 2px 8px #0003}
.w{max-width:520px;margin:0 auto}
header .w{display:flex;justify-content:space-between;align-items:center}
h1{font-size:19px;margin:0}.pill{font-size:11px;font-weight:700;background:#0003;padding:3px 10px;border-radius:99px}
main{padding:14px 14px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}
h2{font-size:15px;margin:0}small{display:block;color:var(--mut);font-size:11.5px}
label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;background:var(--inp);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font:inherit}
input:focus,select:focus{outline:2px solid var(--br)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px;background:var(--soft);color:var(--br)}
button.pri{background:var(--br);color:#fff}button.sm{padding:6px 10px;font-size:12px}
.tools{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.line{display:flex;align-items:center;gap:8px;background:var(--inp);border-radius:12px;padding:8px 10px;margin-top:8px}
.line b{font-size:13px}.line .q{width:78px;padding:6px 8px;text-align:right}.u{font-size:12px;color:var(--mut);width:42px}
.lc{width:62px;text-align:right}.x{background:none;color:var(--mut);padding:2px 6px;font-size:20px}
.empty{color:var(--mut);text-align:center;margin:14px 0 4px}
.tot{background:var(--tot);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.tot .big{font-size:26px;font-weight:800;color:var(--gold)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tot small{color:#94a3b8}
.tot .r{display:flex;justify-content:space-between;margin-top:6px;font-size:13px}
.tot hr{border:0;border-top:1px solid #334155;margin:12px 0}
.tot input{background:#1e293b;border-color:#334155;color:#fff}
.mrow{display:flex;gap:8px;align-items:center;padding:11px 14px;border-top:1px solid var(--bd);cursor:pointer;text-align:left;width:100%;background:none;color:var(--tx);border-radius:0;font-weight:400}
.mrow:first-child{border-top:0}.mrow span:last-child{text-align:right;font-weight:700;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:9}
nav .w{display:flex}nav button{flex:1;background:none;color:var(--mut);border-radius:0;font-size:12px}
nav button.on{color:var(--br)}nav i{display:block;font-style:normal;font-size:20px}
#dlg{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
#dlg>div{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:380px;max-height:90%;overflow:auto}
#dlg h3{margin:0 0 4px;font-size:17px}.dact{display:flex;gap:8px;margin-top:16px}.dact button{flex:1}
.tag{font-size:11px;font-weight:700;background:var(--soft);color:var(--br);padding:3px 8px;border-radius:99px;white-space:nowrap}.oh,.orow{display:flex;gap:8px;font-size:12.5px;padding:8px 2px;align-items:center}.oh{color:var(--mut);margin-top:10px;font-size:11px;text-transform:uppercase;font-weight:700}.oh span+span,.oh b+b,.orow span+span{width:70px;text-align:right}.orow{width:100%;background:none;color:var(--tx);border-radius:0;font-weight:400;text-align:left;border-top:1px solid var(--bd)}.row select{flex:1}.ord{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;font-weight:400}.kv{display:flex;justify-content:space-between;font-size:13.5px;margin-top:5px}.kv.t{border-top:1px solid var(--bd);padding-top:8px;margin-top:8px;font-size:15px}.kv.t b{color:var(--br)}#login{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}.err{color:#ef4444;font-size:13px;min-height:20px;margin-top:8px}.brand{display:flex;align-items:center}.lg{width:40px;height:40px;border-radius:50%;margin-right:10px;border:2px solid #fff8}.lgb{display:block;width:130px;height:130px;border-radius:50%;margin:0 auto 10px}.r2{margin-top:14px;text-align:right}.dng{background:none;color:#ef4444;margin-top:8px;width:100%}
</style>
</head>

<main class="w" id="app">
<div class="row" style="margin-bottom:10px"><small id="sync" class="grow"></small><button class="sm" id="bres">📂 Restaurer</button><input type="file" id="fres" accept=".xlsx,.json" hidden><button class="sm bsave">💾 Sauvegarder</button><button class="sm" id="bout">Déconnexion</button></div>
<section id="t1">
 <div class="card">
  <label style="margin-top:0">Gâteau / projet</label>
  <select id="sel"></select>
  <div class="tools"><button class="sm" id="bnew">＋ Nouveau</button><button class="sm" id="bdup">Dupliquer</button><button class="sm" id="bren">Renommer</button><button class="sm" id="bdel">Supprimer</button></div>
 </div>
 <div class="card">
  <div class="row"><h2 class="grow">🧺 Ingrédients utilisés</h2><button class="sm" id="badd">+ Ajouter</button></div>
  <div id="items"></div>
 </div>
 <div class="tot">
  <div class="r" style="margin:0"><span>Matières premières</span><b id="tmat"></b></div>
  <div class="g2" style="margin-top:10px">
   <div><small>Autres frais (MAD)</small><input id="extra" type="number" inputmode="decimal" min="0" step="any"></div>
   <div><small>Marge (%)</small><input id="margin" type="number" inputmode="decimal" min="0" step="any"></div>

  <div class="r"><span>Prix de vente conseillé</span><b id="tprice" style="color:var(--ok);font-size:17px"></b></div>
  <div class="r"><small>Bénéfice</small><small id="tprofit"></small></div>
 </div>
 <div class="card">

  <label>Client</label>
  <div class="row"><select id="csel"></select><button class="sm" id="bcli2">＋ Nouveau</button></div>
  <div class="g2"><div><label>Prix de vente (MAD)</label><input id="bill" type="number" inputmode="decimal" min="0" step="any"></div><div><label>Remise (MAD)</label><input id="rem" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div></div>
  <button class="pri" id="bord" style="width:100%;margin-top:14px">Ajouter la commande</button>

 <div class="card" style="padding:0;overflow:hidden" id="mats"></div>
</section>
<section id="t3" hidden>
 <div class="card row" id="chead"><div class="grow"><h2>Clients</h2><small id="cinfo"></small></div><button class="sm bsave">💾 Sauvegarder</button><button class="pri sm" id="bcli">+ Nouveau client</button></div>
 <div id="clients"></div>
</section>
</main>
<nav id="nav"><div class="w"><button id="n1" class="on"><i>🧮</i>Calculateur</button><button id="n2"><i>📦</i>Matières</button><button id="n3"><i>👥</i>Clients</button></div></nav>
<div id="dlg" hidden><div><h3 id="dt"></h3><div id="db"></div><button class="dng" id="dx" hidden></button><div class="dact"><button id="dno">Annuler</button><button class="pri" id="dok">OK</button></div></div></div>

<script>
const U={g:[1,"g"],kg:[1000,"g"],ml:[1,"ml"],L:[1000,"ml"],pc:[1,"pièce"]};
const UN={kg:"Kilo (kg)",g:"Gramme (g)",L:"Litre (L)",ml:"Millilitre (ml)",pc:"Pièce"};
const UL={kg:"kg",g:"g",L:"L",ml:"ml",pc:"pièce"};

let S={materials:[],recipes:[],clients:[],cur:0};
try{S.cur=+localStorage.getItem("cakecost.cur")||0}catch(e){}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const f=n=>(n||0).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});
const lp=(m,p)=>(p!=null?p:m.price)/U[m.unit][0];
const bu=m=>U[m.unit][1];
const mat=id=>S.materials.find(m=>m.id===id);
const rec=()=>S.recipes.find(r=>r.id===S.cur)||S.recipes[0];

function calc(r){let t=0;if(r&&r.items)r.items.forEach(i=>{const m=mat(i.m);if(m)t+=lp(m,i.p)*i.q});return t}

function totals(){
  const r=rec();if(!r)return;
  const c=calc(r),cost=c+(+r.extra||0),p=cost*(1+(+r.margin||0)/100);
  $("tmat").textContent=f(c)+" MAD";
  $("tcost").textContent=f(cost)+" MAD";
  $("tprice").textContent=f(p)+" MAD";
  $("tprofit").textContent=f(p-cost)+" MAD";
  $("bill").placeholder=p.toFixed(2);
}

function renderCalc(){
  const r=rec();if(!r)return;
  $("sel").innerHTML=S.recipes.map(x=>`<option value="${x.id}"${x.id===r.id?" selected":""}>${esc(x.name)}</option>`).join("");
  $("items").innerHTML=r.items.length?r.items.map((i,k)=>{
    const m=mat(i.m);if(!m)return"";
    return `<div class="line"><div class="grow"><b>${esc(m.name)}</b><small>${f(lp(m,i.p)*U[m.unit][0])} MAD / ${UL[m.unit]}</small></div><input class="q" type="number" inputmode="decimal" min="0" step="any" value="${i.q}" data-k="${k}"><span class="u">${bu(m)}</span><b class="lc" id="lc${k}">${f(lp(m,i.p)*i.q)}</b><button class="x" data-del="${k}" aria-label="Retirer">×</button></div>`
  }).join(""):`<p class="empty">Aucun ingrédient. Appuyez sur « Ajouter ».</p>`;
  $("margin").value=r.margin||0;
  $("extra").value=r.extra||0;
  totals();
  fillCsel();
}

function renderMats(){
  $("mats").innerHTML=S.materials.map(m=>`<button class="mrow" data-m="${m.id}"><span class="grow"><b>${esc(m.name)}</b></span><span>${f(m.price)} MAD<small>/ ${UL[m.unit]}</small></span></button>`).join("")||`<p class="empty">Aucune matière.</p>`;
}

function fillCsel(){
  $("csel").innerHTML=S.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")||`<option value="">-- Aucun client --</option>`;
}

let okFn=null;
function dlg(title,body,ok,extra){
  $("dt").textContent=title;
  $("db").innerHTML=body;
  $("dlg").hidden=false;
  okFn=ok;
}

$("dno").onclick=()=>{$("dlg").hidden=true;};
$("dok").onclick=()=>{if(okFn)okFn();$("dlg").hidden=true;};

// Initialisation des données par défaut si vide (avec livraison à 20 MAD)
function initDefaultData(){
  if(!S.materials || !S.materials.length){
    S.materials = [
      { id: 1, name: "Farine", price: 10, unit: "kg" },
      { id: 2, name: "Sucre", price: 10, unit: "kg" },
      { id: 3, name: "Œufs", price: 1.39, unit: "pc" },
      { id: 4, name: "Pâte à sucre", price: 60, unit: "kg" },
      { id: 26, name: "Livraison", price: 20, unit: "pc" }
    ];
  } else {
    if(!S.materials.find(m=>m.id===26)){
      S.materials.push({ id: 26, name: "Livraison", price: 20, unit: "pc" });
    }
  }

  if(!S.recipes || !S.recipes.length){
    S.recipes = [
      {
        id: 1,
        name: "Cake Design 10/15P",
        margin: 50,
        extra: 0,
        items: [
          { m: 1, q: 500 },
          { m: 2, q: 500 },
          { m: 3, q: 6 },
          { m: 26, q: 1 }
        ]
      }
    ];
    S.cur = 1;
  }
}

initDefaultData();
renderCalc();
renderMats();
</script>
</body>
