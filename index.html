<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Youmi Cake Manager</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f8fafc;--card:#fff;--tx:#1e293b;--mut:#64748b;--bd:#e2e8f0;--br:#e11d48;--soft:#fff1f2;--inp:#f1f5f9;--head:#db2777;--tot:#0f172a;--gold:#facc15;--ok:#34d399}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:84px}
header{background:var(--head);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:9}
.w{max-width:520px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
h1{font-size:19px;margin:0}
main{padding:14px 14px 0;max-width:520px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1}
label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;background:var(--inp);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px;background:var(--soft);color:var(--br)}
button.pri{background:var(--br);color:#fff}
.line{display:flex;align-items:center;gap:8px;background:var(--inp);border-radius:12px;padding:8px 10px;margin-top:8px}
.line .q{width:78px;padding:6px 8px;text-align:right}
.tot{background:var(--tot);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.tot .big{font-size:26px;font-weight:800;color:var(--gold)}
.tot .r{display:flex;justify-content:space-between;margin-top:6px;font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:8px 0;z-index:9}
nav .w{display:flex}nav button{flex:1;background:none;color:var(--mut);border-radius:0}
nav button.on{color:var(--br)}
#login{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
</style>
</head>
<body>

<!-- ECRAN DE CONNEXION -->
<div id="login">
  <div class="card" style="width:100%;max-width:360px;text-align:center">
    <div style="font-size:40px;margin-bottom:10px">🎂</div>
    <h2 style="margin:0 0 4px;font-size:20px">Youmi Cake Manager</h2>
    <p style="color:var(--mut);font-size:13px;margin:0 0 16px">Connexion</p>
    <div style="text-align:left">
      <label>Nom d’utilisateur</label>
      <input id="lu" value="imad">
      <label>Mot de passe</label>
      <input id="lp" type="password" value="123456">
    </div>
    <button class="pri" onclick="seConnecter()" style="width:100%;margin-top:16px;padding:12px">Se connecter</button>
  </div>
</div>

<!-- EN-TETE -->
<header>
  <div class="w">
    <h1>🎂 Youmi Cake Manager</h1>
    <span style="font-size:11px;background:#0003;padding:3px 8px;border-radius:99px">MAD (DH)</span>
  </div>
</header>

<!-- CONTENU PRINCIPAL -->
<main>
  <div class="row" style="margin-bottom:10px">
    <span class="grow"></span>
    <button onclick="seDeconnecter()">Déconnexion</button>
  </div>

  <!-- ONGLET 1: CALCULATEUR -->
  <div id="t1">
    <div class="card">
      <label style="margin-top:0">Gâteau / Projet</label>
      <select id="sel"></select>
    </div>

    <div class="card">
      <div class="row">
        <h3 style="margin:0" class="grow">🧺 Ingrédients & Raisons</h3>
      </div>
      <div id="items"></div>
    </div>

    <div class="tot">
      <div class="r"><span>Matières premières</span><b id="tmat">0.00 MAD</b></div>
      <div class="g2" style="margin-top:10px">
        <div><label style="color:#94a3b8">Autres frais</label><input id="extra" type="number" value="0" oninput="totals()"></div>
        <div><label style="color:#94a3b8">Marge (%)</label><input id="margin" type="number" value="50" oninput="totals()"></div>
      </div>
      <hr style="border:0;border-top:1px solid #334155;margin:12px 0">
      <div class="r" style="align-items:center"><span>Coût de revient</span><span class="big" id="tcost">0.00 MAD</span></div>
      <div class="r"><span>Prix conseillé</span><b id="tprice" style="color:var(--ok);font-size:17px">0.00 MAD</b></div>
      <div class="r"><small style="color:#94a3b8">Bénéfice</small><small id="tprofit" style="color:#94a3b8">0.00 MAD</small></div>
    </div>
  </div>

  <!-- ONGLET 2: MATIERES -->
  <div id="t2" style="display:none">
    <div class="card">
      <h3 style="margin:0 0 10px">📦 Liste des matières premières</h3>
      <div id="mats"></div>
    </div>
  </div>
</main>

<!-- NAVIGATION -->
<nav>
  <div class="w">
    <button id="n1" class="on" onclick="nav(1)">🧮 Calculateur</button>
    <button id="n2" onclick="nav(2)">📦 Matières</button>
  </div>
</nav>

<script>
// Base de données complète avec la LIVRAISON (20 DH)
let S = {
  materials: [
    { id: 1, name: "Farine", price: 10, unit: "kg" },
    { id: 2, name: "Sucre", price: 10, unit: "kg" },
    { id: 3, name: "Œufs", price: 1.39, unit: "pc" },
    { id: 4, name: "Pâte à sucre", price: 60, unit: "kg" },
    { id: 26, name: "Livraison", price: 20, unit: "pc" }
  ],
  recipes: [
    {
      id: 1,
      name: "Cake Design 10/15P",
      margin: 50,
      extra: 0,
      items: [
        { m: 1, q: 0.5 },
        { m: 2, q: 0.5 },
        { m: 3, q: 6 },
        { m: 26, q: 1 }
      ]
    }
  ]
};

function seConnecter() {
  document.getElementById("login").style.display = "none";
}

function seDeconnecter() {
  document.getElementById("login").style.display = "flex";
}

function nav(tab) {
  document.getElementById("t1").style.display = tab === 1 ? "block" : "none";
  document.getElementById("t2").style.display = tab === 2 ? "block" : "none";
  document.getElementById("n1").className = tab === 1 ? "on" : "";
  document.getElementById("n2").className = tab === 2 ? "on" : "";
}

function f(n) {
  return (n || 0).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function totals() {
  let r = S.recipes[0];
  let c = 0;
  r.items.forEach(i => {
    let m = S.materials.find(x => x.id === i.m);
    if(m) {
      let unitDiv = (m.unit === "kg" || m.unit === "L") ? 1000 : 1;
      // Ajustement de calcul si quantité en grammes ou pièces
      if (m.unit === "kg" && i.q < 10) unitDiv = 1; // Si renseigné en kg direct (ex: 0.5)
      c += (m.price / unitDiv) * i.q;
    }
  });

  let extra = +document.getElementById("extra").value || 0;
  let margin = +document.getElementById("margin").value || 0;
  let cost = c + extra;
  let price = cost * (1 + margin / 100);

  document.getElementById("tmat").textContent = f(c) + " MAD";
  document.getElementById("tcost").textContent = f(cost) + " MAD";
  document.getElementById("tprice").textContent = f(price) + " MAD";
  document.getElementById("tprofit").textContent = f(price - cost) + " MAD";
}

function render() {
  let r = S.recipes[0];
  document.getElementById("sel").innerHTML = `<option>${r.name}</option>`;
  
  let html = "";
  r.items.forEach(i => {
    let m = S.materials.find(x => x.id === i.m);
    if(m) {
      html += `<div class="line">
        <div class="grow"><b>${m.name}</b><br><small style="color:var(--mut)">${f(m.price)} MAD / ${m.unit}</small></div>
        <span>${i.q} ${m.unit}</span>
      </div>`;
    }
  });
  document.getElementById("items").innerHTML = html;

  let matsHtml = "";
  S.materials.forEach(m => {
    matsHtml += `<div class="line">
      <div class="grow"><b>${m.name}</b></div>
      <b>${f(m.price)} MAD / ${m.unit}</b>
    </div>`;
  });
  document.getElementById("mats").innerHTML = matsHtml;

  totals();
}

render();
</script>
</body>
</html>
