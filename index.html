<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<title>Youmi Cake Manager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{color-scheme:light dark;--bg:#f8fafc;--card:#fff;--tx:#1e293b;--mut:#64748b;--bd:#e2e8f0;--br:#e11d48;--soft:#fff1f2;--inp:#f1f5f9;--head:#db2777;--tot:#0f172a;--gold:#facc15;--ok:#34d399;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151b2e;--tx:#e5e7eb;--mut:#94a3b8;--bd:#27304a;--br:#fb7185;--soft:#3b1d2a;--inp:#1e2640;--head:#9d174d;--tot:#050814}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#151b2e;--tx:#e5e7eb;--mut:#94a3b8;--bd:#27304a;--br:#fb7185;--soft:#3b1d2a;--inp:#1e2640;--head:#9d174d;--tot:#050814}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head);z-index:10}
header{background:var(--head);color:#fff;padding:14px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:9;box-shadow:0 2px 8px #0003}
.w{max-width:520px;margin:0 auto}
header .w{display:flex;justify-content:space-between;align-items:center}
h1{font-size:19px;margin:0}.pill{font-size:11px;font-weight:700;background:#0003;padding:3px 10px;border-radius:99px}
main{padding:14px 14px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}
h2{font-size:15px;margin:0}small{display:block;color:var(--mut);font-size:11.5px}
label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;background:var(--inp);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font:inherit}
input:focus,select:focus{outline:2px solid var(--br)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px;background:var(--soft);color:var(--br)}
button.pri{background:var(--br);color:#fff}button.sm{padding:6px 10px;font-size:12px}
.tools{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.line{display:flex;align-items:center;gap:8px;background:var(--inp);border-radius:12px;padding:8px 10px;margin-top:8px}
.line b{font-size:13px}.line .q{width:78px;padding:6px 8px;text-align:right}.u{font-size:12px;color:var(--mut);width:42px}
.lc{width:62px;text-align:right}.x{background:none;color:var(--mut);padding:2px 6px;font-size:20px}
.empty{color:var(--mut);text-align:center;margin:14px 0 4px}
.tot{background:var(--tot);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.tot .big{font-size:26px;font-weight:800;color:var(--gold)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tot small{color:#94a3b8}
.tot .r{display:flex;justify-content:space-between;margin-top:6px;font-size:13px}
.tot hr{border:0;border-top:1px solid #334155;margin:12px 0}
.tot input{background:#1e293b;border-color:#334155;color:#fff}
.mrow{display:flex;gap:8px;align-items:center;padding:11px 14px;border-top:1px solid var(--bd);cursor:pointer;text-align:left;width:100%;background:none;color:var(--tx);border-radius:0;font-weight:400}
.mrow:first-child{border-top:0}.mrow span:last-child{text-align:right;font-weight:700;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:9}
nav .w{display:flex}nav button{flex:1;background:none;color:var(--mut);border-radius:0;font-size:12px}
nav button.on{color:var(--br)}nav i{display:block;font-style:normal;font-size:20px}
#dlg{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
#dlg>div{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:380px;max-height:90%;overflow:auto}
#dlg h3{margin:0 0 4px;font-size:17px}.dact{display:flex;gap:8px;margin-top:16px}.dact button{flex:1}
.tag{font-size:11px;font-weight:700;background:var(--soft);color:var(--br);padding:3px 8px;border-radius:99px;white-space:nowrap}.oh,.orow{display:flex;gap:8px;font-size:12.5px;padding:8px 2px;align-items:center}.oh{color:var(--mut);margin-top:10px;font-size:11px;text-transform:uppercase;font-weight:700}.oh span+span,.oh b+b,.orow span+span{width:70px;text-align:right}.orow{width:100%;background:none;color:var(--tx);border-radius:0;font-weight:400;text-align:left;border-top:1px solid var(--bd)}.row select{flex:1}.ord{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;font-weight:400}.kv{display:flex;justify-content:space-between;font-size:13.5px;margin-top:5px}.kv.t{border-top:1px solid var(--bd);padding-top:8px;margin-top:8px;font-size:15px}.kv.t b{color:var(--br)}#login{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}.err{color:#ef4444;font-size:13px;min-height:20px;margin-top:8px}.brand{display:flex;align-items:center}.lg{width:40px;height:40px;border-radius:50%;margin-right:10px;border:2px solid #fff8}.lgb{display:block;width:130px;height:130px;border-radius:50%;margin:0 auto 10px}.r2{margin-top:14px;text-align:right}.dng{background:none;color:#ef4444;margin-top:8px;width:100%}
</style>
</head>

 </div>

 <div class="card" style="padding:0;overflow:hidden" id="mats"></div>

<nav id="nav"><div class="w"><button id="n1" class="on"><i>🧮</i>Calculateur</button><button id="n2"><i>📦</i>Matières</button><button id="n3"><i>👥</i>Clients</button></div></nav>
<div id="dlg" hidden><div><h3 id="dt"></h3><div id="db"></div><button class="dng" id="dx" hidden></button><div class="dact"><button id="dno">Annuler</button><button class="pri" id="dok">OK</button></div></div></div>
<script>
const U={g:[1,"g"],kg:[1000,"g"],ml:[1,"ml"],L:[1000,"ml"],pc:[1,"pièce"]};
const UN={kg:"Kilo (kg)",g:"Gramme (g)",L:"Litre (L)",ml:"Millilitre (ml)",pc:"Pièce"};const UL={kg:"kg",g:"g",L:"L",ml:"ml",pc:"pièce"};
let S={materials:[],recipes:[],clients:[],cur:0};try{S.cur=+localStorage.getItem("cakecost.cur")||0}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const f=n=>n.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});
const lp=(m,p)=>(p!=null?p:m.price)/U[m.unit][0];
const bu=m=>U[m.unit][1];
const mat=id=>S.materials.find(m=>m.id===id);
const rec=()=>S.recipes.find(r=>r.id===S.cur)||S.recipes[0];
function calc(r){let t=0;r.items.forEach(i=>{const m=mat(i.m);if(m)t+=lp(m,i.p)*i.q});return t}
function totals(){const r=rec(),c=calc(r),cost=c+(+r.extra||0),p=cost*(1+(+r.margin||0)/100);
 $("tmat").textContent=f(c)+" MAD";$("tcost").textContent=f(cost)+" MAD";$("tprice").textContent=f(p)+" MAD";$("tprofit").textContent=f(p-cost)+" MAD";$("bill").placeholder=p.toFixed(2)}
function renderCalc(){
 const r=rec();
 $("sel").innerHTML=S.recipes.map(x=>`<option value="${x.id}"${x.id===r.id?" selected":""}>${esc(x.name)}</option>`).join("");
 $("items").innerHTML=r.items.length?r.items.map((i,k)=>{const m=mat(i.m);if(!m)return"";
  return `<div class="line"><div class="grow"><b>${esc(m.name)}</b><small>${f(lp(m,i.p)*U[m.unit][0])} MAD / ${UL[m.unit]}</small></div><input class="q" type="number" inputmode="decimal" min="0" step="any" value="${i.q}" data-k="${k}"><span class="u">${bu(m)}</span><b class="lc" id="lc${k}">${f(lp(m,i.p)*i.q)}</b><button class="x" data-del="${k}" aria-label="Retirer">×</button></div>`}).join(""):`<p class="empty">Aucun ingrédient. Appuyez sur « Ajouter ».</p>`;
 $("margin").value=r.margin;$("extra").value=r.extra;totals();fillCsel();
}
function renderMats(){
 $("mats").innerHTML=S.materials.map(m=>`<button class="mrow" data-m="${m.id}"><span class="grow"><b>${esc(m.name)}</b></span><span>${f(m.price)} MAD<small>/ ${UL[m.unit]}</small></span></button>`).join("")||`<p class="empty">Aucune matière.</p>`;
}
let okFn=null;
function dlg(title,body,ok,extra){$("dt").textContent=title;$("db").innerHTML=body;okFn=ok;const e=$("dx");e.hidden=!extra;if(extra){e.textContent=extra.label;e.onclick=()=>{extra.fn();close()}}$("dlg").hidden=false;const i=$("db").querySelector("input,select");if(i)i.focus()}
function close(){$("dlg").hidden=true}
$("dok").onclick=()=>{if(okFn&&okFn()===false)return;close()};$("dno").onclick=close;
function nameDlg(title,val,fn){dlg(title,`<label>Nom</label><input id="f1" value="${esc(val)}">`,()=>{const n=$("f1").value.trim();if(!n)return false;fn(n);save();renderCalc()})}
$("bnew").onclick=()=>nameDlg("Nouveau gâteau","",n=>{const r={id:uid(),name:n,items:[],margin:100,extra:0};S.recipes.push(r);S.cur=r.id});
$("bdup").onclick=()=>nameDlg("Dupliquer",rec().name+" (copie)",n=>{const o=rec(),r=JSON.parse(JSON.stringify(o));r.id=uid();r.name=n;S.recipes.push(r);S.cur=r.id});
$("bren").onclick=()=>nameDlg("Renommer",rec().name,n=>{rec().name=n});
$("bdel").onclick=()=>dlg("Supprimer ce gâteau ?",`<p>« ${esc(rec().name)} » sera supprimé.</p>`,()=>{S.recipes=S.recipes.filter(r=>r.id!==S.cur);if(!S.recipes.length)S.recipes.push({id:uid(),name:"Nouveau gâteau",items:[],margin:100,extra:0});S.cur=S.recipes[0].id;save();renderCalc()});
$("sel").onchange=e=>{S.cur=+e.target.value;save();renderCalc()};
$("margin").oninput=e=>{rec().margin=parseFloat(e.target.value)||0;save();totals()};
$("extra").oninput=e=>{rec().extra=parseFloat(e.target.value)||0;save();totals()};
$("items").addEventListener("input",e=>{const k=e.target.dataset.k;if(k==null)return;const it=rec().items[k];it.q=parseFloat(e.target.value)||0;$("lc"+k).textContent=f(lp(mat(it.m),it.p)*it.q);save();totals()});
$("items").addEventListener("click",e=>{const k=e.target.dataset.del;if(k==null)return;rec().items.splice(k,1);save();renderCalc()});
$("badd").onclick=()=>{
 const ms=S.materials;if(!ms.length){dlg("Ajouter","<p>Ajoutez d’abord des matières dans l’onglet « Matières ».</p>",null);return}
 dlg("Ajouter un ingrédient",`<label>Matière première</label><select id="f1">${ms.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("")}</select><label id="fl1"></label><input id="f3" type="number" inputmode="decimal" min="0" step="any"><label id="fl2"></label><div class="row"><button class="sm" id="fm" type="button">−</button><input id="f2" type="number" inputmode="decimal" min="0" step="any" placeholder="0"><button class="sm" id="fp" type="button">+</button></div><div class="r2">Coût de cette ligne : <b id="fc">0,00 MAD</b></div>`,()=>{
  const m=mat(+$("f1").value),q=parseFloat($("f2").value),p=parseFloat($("f3").value);
  if(!(q>0)||isNaN(p))return false;
  rec().items.push({m:m.id,q,p:p!==m.price?p:null});save();renderCalc()});
 const g=()=>mat(+$("f1").value);
 const c=()=>{const p=parseFloat($("f3").value),q=parseFloat($("f2").value)||0;$("fc").textContent=f(isNaN(p)?0:lp(g(),p)*q)+" MAD"};
 const u=()=>{const m=g(),pc=m.unit==="pc";$("f3").value=m.price;$("fl1").textContent="Prix de la matière (MAD / "+UL[m.unit]+")";$("fl2").textContent=pc?"Nombre de pièces":"Quantité utilisée ("+bu(m)+")";$("fm").hidden=$("fp").hidden=!pc;$("f2").step=pc?"1":"any";$("f2").value=pc?1:"";c()};
 $("f1").onchange=u;$("f3").oninput=c;$("f2").oninput=c;
 $("fm").onclick=()=>{$("f2").value=Math.max(0,(parseFloat($("f2").value)||0)-1);c()};
 $("fp").onclick=()=>{$("f2").value=(parseFloat($("f2").value)||0)+1;c()};
 u();
};
function matDlg(m){
 const n=!m;m=m||{name:"",price:"",unit:"kg"};
 dlg(n?"Nouvelle matière":"Modifier la matière",`<label>Nom</label><input id="f1" value="${esc(m.name)}"><label>Unité</label><select id="f4">${Object.keys(UN).map(k=>`<option value="${k}"${k===m.unit?" selected":""}>${UN[k]}</option>`).join("")}</select><label>Prix (MAD) par unité choisie</label><input id="f2" type="number" inputmode="decimal" min="0" step="any" value="${m.price}"><small style="margin-top:8px">Ex. : unité kilo → prix d’1 kg. Dans les recettes, les kilos se saisissent en g et les litres en ml.</small>`,()=>{
  const name=$("f1").value.trim(),price=parseFloat($("f2").value);
  if(!name||!(price>=0))return false;
  const v={name,price,unit:$("f4").value};
  if(n)S.materials.push({id:uid(),...v});else Object.assign(m,v);
  save();renderMats();renderCalc();
 },n?null:{label:"Supprimer cette matière",fn:()=>{S.materials=S.materials.filter(x=>x.id!==m.id);S.recipes.forEach(r=>r.items=r.items.filter(i=>i.m!==m.id));save();renderMats();renderCalc()}});
}
$("bmat").onclick=()=>matDlg();
$("mats").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(b)matDlg(mat(+b.dataset.m))});
function tab(n){[1,2,3].forEach(i=>{$("t"+i).hidden=n!==i;$("n"+i).className=n===i?"on":""});window.scrollTo(0,0)}
$("n1").onclick=()=>tab(1);$("n2").onclick=()=>tab(2);$("n3").onclick=()=>{curCl=null;renderClients();tab(3)};
const sum=(a,k)=>a.reduce((t,o)=>t+o[k],0);
const dfr=d=>new Date(d).toLocaleDateString("fr-FR");
function fillCsel(sel){
 const v=sel||$("csel").value;
 $("csel").innerHTML=S.clients.length?S.clients.map(c=>`<option value="${c.id}">${esc(c.name)}${c.phone?" · "+esc(c.phone):""}</option>`).join(""):`<option value="">Aucun client : créez-en un</option>`;
 if(v&&S.clients.some(c=>c.id===+v))$("csel").value=v;
}
let curCl=null;
function renderClients(){
 const c=S.clients.find(x=>x.id===curCl);if(!c)curCl=null;
 $("chead").hidden=!!c;
 $("cinfo").textContent=S.clients.length+" client(s)";
 const el=$("clients");
 if(!c){el.innerHTML=S.clients.length?`<div class="card" style="padding:0;overflow:hidden">${S.clients.map(x=>`<button class="mrow" data-open="${x.id}"><span class="grow"><b>${esc(x.name)}</b><small>${x.type==="rs"?"Réseaux sociaux":"Particulier"} · ${x.orders.length} commande(s)</small></span><span>›</span></button>`).join("")}</div>`:'<p class="empty">Aucun client. Appuyez sur « Nouveau client ».</p>';return}
 const cost=sum(c.orders,"cost"),pv=sum(c.orders,"price"),re=sum(c.orders,"remise"),net=pv-re;
 el.innerHTML=`<div class="row" style="margin-bottom:10px"><button class="sm" data-back="1">← Clients</button><span class="grow"></span><button class="sm" data-c="${c.id}">Modifier le client</button></div>
 <div class="card"><div class="row"><h2 class="grow">${esc(c.name)}</h2><span class="tag">${c.type==="rs"?"Réseaux sociaux":"Particulier"}</span></div><small style="margin-top:6px">📞 ${esc(c.phone)||"—"}</small><small>📍 ${esc(c.address)||"—"}</small></div>
 ${c.orders.map(o=>`<button class="ord" data-o="${o.id}"><div class="row"><b class="grow">${esc(o.cake)}</b><small>${dfr(o.d)}${o.by?" · "+esc(o.by):""}</small></div><div class="kv"><span>Coût de revient</span><b>${f(o.cost)} MAD</b></div><div class="kv"><span>Prix de vente</span><b>${f(o.price)} MAD</b></div><div class="kv"><span>Remise</span><b>− ${f(o.remise)} MAD</b></div><div class="kv t"><span>Total à facturer</span><b>${f(o.price-o.remise)} MAD</b></div><div class="kv"><small>Bénéfice</small><small>${f(o.price-o.remise-o.cost)} MAD</small></div></button>`).join("")||'<p class="empty">Aucune commande. Ajoutez-en depuis le Calculateur.</p>'}
 <div class="tot"><b>Récapitulatif (${c.orders.length} commande${c.orders.length>1?"s":""})</b><div class="r"><span>Coût de revient</span><b>${f(cost)} MAD</b></div><div class="r"><span>Prix de vente</span><b>${f(pv)} MAD</b></div><div class="r"><span>Remise</span><b>− ${f(re)} MAD</b></div><hr><div class="r" style="margin:0;align-items:center"><span>Total à facturer</span><span class="big">${f(net)} MAD</span></div><div class="r"><small>Bénéfice</small><small>${f(net-cost)} MAD</small></div></div>`;
}
function clientDlg(c){
 const n=!c;c=c||{name:"",phone:"",address:"",type:"part"};
 dlg(n?"Nouveau client":"Modifier le client",`<label>Nom du client</label><input id="f1" value="${esc(c.name)}"><label>Téléphone</label><input id="f2" type="tel" inputmode="tel" value="${esc(c.phone)}"><label>Adresse</label><input id="f3" value="${esc(c.address)}"><label>Type de client</label><select id="f4"><option value="rs"${c.type==="rs"?" selected":""}>Réseaux sociaux</option><option value="part"${c.type!=="rs"?" selected":""}>Particulier</option></select>${n?"":'<small style="margin-top:8px">Supprimer ce client efface aussi ses commandes.</small>'}`,()=>{
  const name=$("f1").value.trim();if(!name)return false;
  const v={name,phone:$("f2").value.trim(),address:$("f3").value.trim(),type:$("f4").value};
  if(n){c={id:uid(),orders:[],...v};S.clients.push(c)}else Object.assign(c,v);
  save();renderClients();fillCsel(c.id)},
  n?null:{label:"Supprimer ce client",fn:()=>{S.clients=S.clients.filter(x=>x.id!==c.id);save();renderClients();fillCsel()}});
}
function ordDlg(cl,o){
 dlg("Modifier la commande",`<small>${esc(o.cake)} · ${dfr(o.d)}</small><label>Coût de revient (MAD)</label><input id="f3" type="number" inputmode="decimal" min="0" step="any" value="${o.cost}"><label>Prix de vente (MAD)</label><input id="f1" type="number" inputmode="decimal" min="0" step="any" value="${o.price}"><label>Remise (MAD)</label><input id="f2" type="number" inputmode="decimal" min="0" step="any" value="${o.remise}">`,()=>{
  const p=parseFloat($("f1").value);if(isNaN(p))return false;
  o.price=p;o.remise=parseFloat($("f2").value)||0;o.cost=parseFloat($("f3").value)||0;save();renderClients()},
  {label:"Supprimer la commande",fn:()=>{cl.orders=cl.orders.filter(x=>x.id!==o.id);save();renderClients()}});
}
$("bcli").onclick=()=>clientDlg();$("bcli2").onclick=()=>clientDlg();
$("clients").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.open){curCl=+d.open;renderClients();window.scrollTo(0,0)}
 else if(d.back){curCl=null;renderClients()}
 else if(d.o){const c=S.clients.find(x=>x.id===curCl);ordDlg(c,c.orders.find(o=>o.id===+d.o))}
 else if(d.c)clientDlg(S.clients.find(x=>x.id===+d.c))});
$("bord").onclick=()=>{
 const cl=S.clients.find(c=>c.id===+$("csel").value);
 if(!cl){clientDlg();return}
 const r=rec(),cost=calc(r)+(+r.extra||0),def=cost*(1+(+r.margin||0)/100);
 let p=parseFloat($("bill").value);if(isNaN(p))p=+def.toFixed(2);
 cl.orders.push({id:uid(),d:new Date().toISOString().slice(0,10),cake:r.name,cost:+cost.toFixed(2),price:p,remise:parseFloat($("rem").value)||0,by:ME});
 rec().items=[];rec().extra=0;save();$("bill").value="";$("rem").value="";renderClients();renderCalc();
 const b=$("bord");b.textContent="✓ Ajoutée à "+cl.name;setTimeout(()=>b.textContent="Ajouter la commande",2500);
};

const SEED={"materials":[{"id":1,"name":"Farine","price":10,"unit":"kg"},{"id":2,"name":"Sucre","price":10,"unit":"kg"},{"id":3,"name":"Œufs","price":1.39,"unit":"pc"},{"id":4,"name":"crème fraiche","price":34,"unit":"L"},{"id":5,"name":"Gélatine","price":1.5,"unit":"pc"},{"id":6,"name":"Colorant","price":5,"unit":"pc"},{"id":7,"name":"Feuilletine","price":10,"unit":"g"},{"id":8,"name":"Crème bueno","price":20,"unit":"g"},{"id":9,"name":"Crème pistache","price":18,"unit":"g"},{"id":10,"name":"Pistache","price":10,"unit":"kg"},{"id":11,"name":"noisette","price":10,"unit":"g"},{"id":12,"name":"Noix","price":10,"unit":"kg"},{"id":13,"name":"Chocolat riche NOIR","price":35,"unit":"kg"},{"id":14,"name":"Chocolat riche BLANC","price":35,"unit":"kg"},{"id":15,"name":"Chocolat riche AU LAIT","price":35,"unit":"kg"},{"id":16,"name":"Chocolat Normal","price":4,"unit":"g"},{"id":17,"name":"Poudre chocolat noir","price":10,"unit":"g"},{"id":18,"name":"les boules","price":5,"unit":"pc"},{"id":19,"name":"topper","price":6,"unit":"pc"},{"id":20,"name":"Pâte à sucre","price":60,"unit":"kg"},{"id":21,"name":"Boîte à gâteau petite","price":2,"unit":"pc"},{"id":22,"name":"Boîte à gâteau normal","price":2,"unit":"pc"},{"id":23,"name":"Box cake grand","price":30,"unit":"pc"},{"id":24,"name":"Beurre","price":10,"unit":"g"},{"id":25,"name":"Bougie","price":12,"unit":"pc"},{"id":26,"name":"Papier couisson","price":5,"unit":"pc"},{"id":27,"name":"Papier waffer","price":4,"unit":"pc"},{"id":28,"name":"Fleur normal","price":5,"unit":"pc"},{"id":29,"name":"Fleur artificiel","price":15,"unit":"pc"},{"id":30,"name":"happy birthday","price":8,"unit":"pc"},{"id":31,"name":"Livraison","price":20,"unit":"pc"}],"recipes":[{"extra":0,"id":100,"items":[{"m":1,"q":50},{"m":2,"q":50},{"m":3,"q":2},{"m":31,"q":1}],"margin":100,"name":"MINI CAKE"},{"extra":0,"id":101,"items":[{"m":1,"q":100},{"m":2,"q":100},{"m":3,"q":3},{"m":4,"q":200},{"m":31,"q":1}],"margin":100,"name":"CAKE 4P"},{"extra":0,"id":102,"items":[{"m":31,"q":1}],"margin":100,"name":"CAKEDESIGN 4P"},{"extra":0,"id":103,"items":[{"m":31,"q":1}],"margin":100,"name":"CAKEDESIGN 8P"},{"extra":0,"id":104,"items":[{"m":1,"q":170},{"m":2,"q":160},{"m":3,"q":6},{"m":4,"q":500},{"m":5,"q":4},{"m":7,"q":0.8},{"m":8,"q":1},{"m":9,"q":1},{"m":10,"q":1000},{"m":11,"q":1},{"m":12,"q":1000},{"m":13,"q":150},{"m":14,"q":150},{"m":16,"q":0.1},{"m":17,"q":0.4},{"m":18,"q":10},{"m":19,"q":1},{"m":20,"q":100},{"m":23,"q":1},{"m":25,"q":4},{"m":26,"q":1},{"m":27,"q":3},{"m":28,"q":5},{"m":29,"q":1},{"m":31,"q":1}],"margin":100,"name":"CAKE DESIGN 10/15P"}],"clients":[{"address":"","id":1792325172662603,"name":"lamzal","orders":[],"phone":"","type":"part"}],"cur":104,"v":2};
let ME=null;
const cap=u=>u?u[0].toUpperCase()+u.slice(1):"";
function uid(){return Date.now()*1000+Math.floor(Math.random()*1000)}
function setSync(t){$("sync").textContent=(ME?"👤 "+cap(ME)+" · ":"")+(t||"💾 Données enregistrées sur cet appareil")}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify({v:2,materials:S.materials,recipes:S.recipes,clients:S.clients,cur:S.cur}))}
 catch(e){setSync("⚠️ Enregistrement impossible sur cet appareil")}
}
function loadData(){
 let d=null;
 try{const r=localStorage.getItem(KEY);if(r)d=JSON.parse(r)}catch(e){}
 if(!d){try{const r=localStorage.getItem("cakecost.v2");if(r){d=JSON.parse(r);d.clients=d.clients||[];SEED.clients.forEach(c=>{if(!d.clients.some(x=>x.id===c.id))d.clients.push(c)})}}catch(e){}}
 if(!d||!d.materials||!d.recipes)d=JSON.parse(JSON.stringify(SEED));
 let mg=false;
 if((d.v||0)<2){
  mg=true;let l=d.materials.find(x=>String(x.name).toLowerCase()==="livraison");
  if(!l){l={id:31,name:"Livraison",price:20,unit:"pc"};if(d.materials.some(x=>x.id===31))l.id=uid();d.materials.push(l)}
  d.recipes.forEach(r=>{if(!r.items.some(i=>i.m===l.id))r.items.push({m:l.id,q:1})});
 }
 S.materials=d.materials;S.recipes=d.recipes;S.clients=d.clients||[];S.cur=d.cur||0;
 if(!S.recipes.length)S.recipes.push({id:uid(),name:"Nouveau gâteau",items:[],margin:100,extra:0});
 if(!S.recipes.some(r=>r.id===S.cur))S.cur=S.recipes[S.recipes.length-1].id;
 if(mg)save();
}
function enter(u){ME=u;try{localStorage.setItem("cakecost.user",u)}catch(e){}$("login").hidden=true;$("lp").value="";$("lerr").textContent="";setSync()}
function tryLogin(){const u=$("lu").value.trim().toLowerCase(),p=$("lp").value;if(USERS[u]&&USERS[u]===p)enter(u);else $("lerr").textContent="Nom d’utilisateur ou mot de passe incorrect."}
$("lgo").onclick=tryLogin;$("lp").addEventListener("keydown",e=>{if(e.key==="Enter")tryLogin()});
$("bout").onclick=()=>{ME=null;try{localStorage.removeItem("cakecost.user")}catch(e){}$("login").hidden=false};
async function put(name,data){
 let dl=null;try{dl=await window.claude.use("downloads")}catch(e){}
 if(dl)return dl.save({filename:name,data});
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data]));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
document.querySelectorAll(".bsave").forEach(b=>b.onclick=saveAll);
async function saveAll(){
 const num=v=>+v||0,T=c=>c.type==="rs"?"Réseaux sociaux":"Particulier";
 const mats=[["Matière première","Unité d’achat","Prix (MAD) par unité"],...S.materials.map(m=>[m.name,UN[m.unit],num(m.price)])];
 const rl=[["Gâteau","Matière première","Quantité utilisée","Unité","Prix (MAD) par unité d’achat","Coût (MAD)"]],rs=[["Gâteau","Matières premières (MAD)","Autres frais (MAD)","Coût de revient (MAD)","Marge (%)","Prix de vente conseillé (MAD)"]];
 S.recipes.forEach(r=>{let t=0;r.items.forEach(i=>{const m=mat(i.m);if(!m)return;const c=lp(m,i.p)*i.q;t+=c;rl.push([r.name,m.name,i.q,bu(m),num(i.p!=null?i.p:m.price),+c.toFixed(2)])});const cr=t+num(r.extra);rs.push([r.name,+t.toFixed(2),num(r.extra),+cr.toFixed(2),num(r.margin),+(cr*(1+num(r.margin)/100)).toFixed(2)])});
 const cl=[["Client","Téléphone","Adresse","Type","Commandes","Total à facturer (MAD)"]],od=[["Client","Téléphone","Date","Gâteau","Coût de revient (MAD)","Prix de vente (MAD)","Remise (MAD)","Total à facturer (MAD)","Bénéfice (MAD)","Ajouté par"]];
 let tp=0,tr=0,tc=0;
 S.clients.forEach(c=>{let net=0;c.orders.forEach(o=>{net+=o.price-o.remise;tp+=o.price;tr+=o.remise;tc+=num(o.cost);od.push([c.name,c.phone,dfr(o.d),o.cake,num(o.cost),num(o.price),num(o.remise),+(o.price-o.remise).toFixed(2),+(o.price-o.remise-num(o.cost)).toFixed(2),o.by||""])});cl.push([c.name,c.phone,c.address,T(c),c.orders.length,+net.toFixed(2)])});
 od.push(["TOTAL","","","",+tc.toFixed(2),+tp.toFixed(2),+tr.toFixed(2),+(tp-tr).toFixed(2),+(tp-tr-tc).toFixed(2),""]);
 const stamp=new Date().toISOString().slice(0,10),raw=JSON.stringify({materials:S.materials,recipes:S.recipes,clients:S.clients});let data,name;
 if(window.XLSX){
  const wb=XLSX.utils.book_new();
  [["Clients",cl],["Commandes",od],["Gâteaux",rs],["Recettes",rl],["Matières",mats],["Base",[["Données de restauration : ne pas modifier"],...(raw.match(/[^]{1,30000}/g)||[]).map(x=>[x])]]].forEach(([n,a])=>{const ws=XLSX.utils.aoa_to_sheet(a);ws["!cols"]=a[0].map(h=>({wch:Math.max(14,String(h).length+2)}));XLSX.utils.book_append_sheet(wb,ws,n)});
  data=XLSX.write(wb,{bookType:"xlsx",type:"array"});name="youmi-cake-sauvegarde-"+stamp+".xlsx";
 }else{data=raw;name="youmi-cake-sauvegarde-"+stamp+".json"}
 try{await put(name,data);setSync("✅ Sauvegarde téléchargée")}catch(e){if(!e||e.code!=="declined")setSync("⚠️ Téléchargement impossible"+(e&&e.code?" ("+e.code+")":""))}
}
$("bres").onclick=()=>$("fres").click();
$("fres").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
 try{
  let o;
  if(/\.json$/i.test(f.name))o=JSON.parse(await f.text());
  else{const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});o=JSON.parse(XLSX.utils.sheet_to_json(wb.Sheets["Base"],{header:1}).slice(1).map(r=>r[0]||"").join(""))}
  if(!o.materials||!o.recipes||!o.clients)throw 0;
  dlg("Restaurer la sauvegarde",`<p>Remplacer toutes les données actuelles (${S.clients.length} client(s), ${S.recipes.length} gâteau(x)) par celles du fichier ?</p>`,()=>{S.materials=o.materials;S.recipes=o.recipes;S.clients=o.clients;S.cur=(S.recipes[S.recipes.length-1]||{}).id;save();curCl=null;loadFix();renderCalc();renderMats();renderClients()});
 }catch(err){dlg("Restauration impossible","<p>Ce fichier n’est pas une sauvegarde Youmi Cake valide.</p>",null)}
};
function loadFix(){if(!S.recipes.length)S.recipes.push({id:uid(),name:"Nouveau gâteau",items:[],margin:100,extra:0});if(!S.recipes.some(r=>r.id===S.cur))S.cur=S.recipes[S.recipes.length-1].id}
function boot(){
 let u=null;try{u=localStorage.getItem("cakecost.user")}catch(e){}
 loadData();renderCalc();renderMats();renderClients();
 if(u&&USERS[u])enter(u);else setSync();
}
boot();
</script>
